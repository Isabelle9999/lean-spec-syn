name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Compile every module
        run: python -m compileall -q .

      - name: Imports resolve
        run: |
          python -c "import lean, synth, strategies, metrics, benchmarks, loader, run"
          python -c "import callgraph, modularity, incremental, traits, divergence"

      - name: Pin check
        run: python tests/test_pins.py --static

      - name: Unit graph check
        run: python tests/test_unitgraph.py --static

      - name: Manifest check
        run: python scripts/derive_manifest.py --check

      - name: Test scripts are syntactically valid
        run: python -m compileall -q tests/