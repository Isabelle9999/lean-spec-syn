name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff anthropic

      - name: Lint
        run: ruff check .

      - name: Compile every module
        run: python -m compileall -q .

      - name: Imports resolve
        run: |
          python -c "import lean, synth, strategies, metrics, benchmarks, loader, run"
          python -c "import callgraph, modularity, incremental, traits, divergence"

      - name: Test scripts are syntactically valid
        run: python -m compileall -q tests/