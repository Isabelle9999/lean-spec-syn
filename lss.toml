# both projects use ported forks at v4.31.0 and share package pins for offline seeding
# LeanHammer's premise selection calls the server at leanpremise.net

[projects.aeneas]
dir = "~/lss_lean/aeneas"
lean_version = "v4.31.0"
default = true
env_var = "LSS_AENEAS_DIR"
# hammer via Isabelle9999 ported forks at v4.31.0; both projects share pins for offline seeding
# use hammer { disableGrind := true } — grind kernel error in Lean 4.31.0
has_hammer = true

[projects."lean-native"]
dir = "~/lss_lean/lean-native"
lean_version = "v4.31.0"
has_hammer = true
env_var = "LSS_LEAN_NATIVE_DIR"

[units]
include_loops = true

[server]
workers = 1
cmd_timeout = 30
import_timeout = 180
lake_timeout = 120
env_cache_cap = 8
max_restarts = 20
hammer_timeout = 90
# RLIMIT_DATA/RLIMIT_AS count reserved/mapped address space, not real use, and Lean
# reserves enough of that per thread to make both useless as a cap. a cgroup v2
# cap (memory.max) counts real use, but that includes page cache (mmapped .olean
# files), so a cold cache pins it during import. a watchdog thread that sums
# RssAnon across the process group every 0.25s and kills it over the cap avoids
# both problems.
memory_cap = true
memory_fraction = 0.4

[proof]
aeneas_layer = true
aeneas_heartbeats = 200000
# "local" keeps hammer off leanpremise.net (Hammer/Tactic.lean's own default
# falls back to it anyway, but only after trying the cloud selector first);
# "cloud" leaves hammer's own default alone.
premise_selector = "local"
# rust crates: import Hammer into the crate env, so hammer runs on rust units
# (whole goal and after step*). off by default: with the local selector, hammer
# did not prove `a + b = b + a` in any import setup (2026-10-17), and a crate env
# with Hammer is a second base environment next to the unit graph's, which hit
# the memory cap in the proof-trust test
rust_hammer = false
# heartbeats for a hammer proof on a rust unit (after step*); the whole-goal
# attempt runs under the unit's own preamble (maxHeartbeats 1000000)
hammer_heartbeats = 1000000
# seconds for the Lean work of one candidate's sub-lemma split (layer 3), shared
# evenly across its sub-lemmas: layer 1 always runs, hammer gets what is left
split_seconds = 180
# hammer seconds shared by the mutant proofs of one pass over a unit's mutants
mutant_hammer_seconds = 120

[bench]
# the Aeneas-translated crates the dev and test sets come from (FeatureSuite stays
# the test fixture and is in neither); tools/bench.py select writes bench/split.json
suite = [
  "~/rust_suite/AeneasStandalone",
  "~/rust_suite/AeneasFieldArithmetic",
  "~/rust_suite/Loops",
  "~/rust_suite/NoNestedBorrows",
  "~/rust_suite/Avl",
  "~/rust_suite/Bst",
  "~/rust_suite/Tutorial",
  "~/rust_suite/FoldStep",
  "~/rust_suite/FoldArity",
]
dev_size = 10
seed = 0
