# both projects use ported forks at v4.31.0 and share package pins for offline seeding
# LeanHammer's premise selection calls the server at leanpremise.net

[projects.aeneas]
dir = "~/lss_lean/aeneas"
lean_version = "v4.31.0"
default = true
env_var = "LSS_AENEAS_DIR"
# hammer via Isabelle9999 ported forks at v4.31.0; both projects share pins for offline seeding
# use hammer { disableGrind := true } — grind kernel error in Lean 4.31.0
has_hammer = true

[projects."lean-native"]
dir = "~/lss_lean/lean-native"
lean_version = "v4.31.0"
has_hammer = true
env_var = "LSS_LEAN_NATIVE_DIR"

[units]
include_loops = true

[server]
workers = 1
cmd_timeout = 30
import_timeout = 180
lake_timeout = 120
env_cache_cap = 8
max_restarts = 20
hammer_timeout = 90
# RLIMIT_DATA/RLIMIT_AS count reserved/mapped address space, not real use, and Lean
# reserves enough of that per thread to make both useless as a cap. a cgroup v2
# scope (systemd-run --user --scope, memory.max) counts real use instead.
memory_cap = true
memory_fraction = 0.4

[proof]
aeneas_layer = true
aeneas_heartbeats = 200000
# "local" keeps hammer off leanpremise.net (Hammer/Tactic.lean's own default
# falls back to it anyway, but only after trying the cloud selector first);
# "cloud" leaves hammer's own default alone.
premise_selector = "local"
